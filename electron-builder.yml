appId: com.clac.desktop
productName: CLAC
directories:
  buildResources: resources
  output: release
files:
  - out/**
  # Las pruebas se compilan en out/test y no pintan nada en el instalador.
  - '!out/test/**'
  - package.json
  # El icono lo necesitan la ventana y el de la bandeja, en tiempo de ejecución.
  - resources/icon.ico
  - resources/icon.png
extraResources:
  # La extensión del navegador, lista para cargar en opera://extensions desde
  # la carpeta de la instalación: al actualizar CLAC, se actualiza con ella.
  - from: extension/dist
    to: extension
# De dónde saca CLAC las versiones nuevas, como BONK: las releases del repo,
# que es público y no pide token. Es también lo que hace que la compilación
# escriba el «latest.yml» con el que compara el actualizador.
publish:
  provider: github
  owner: i3SK87
  repo: clac
win:
  # No hay certificado, así que no se comprueba firma; sí el sha512 de cada
  # archivo contra el del «latest.yml», que llega por HTTPS desde GitHub.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch: [x64]
    # La vía de repuesto, como en BONK: si el filtro de Windows no deja pasar
    # el instalador, la carpeta suelta se descomprime y se ejecuta igual.
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  artifactName: ${productName}-${version}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CLAC
  installerLanguages: [es_ES]
  language: 1034
  # Desinstalar no se lleva la caja fuerte: está en %APPDATA%\CLAC y ahí se
  # queda. Perderla por quitar el programa sería perder todas las contraseñas.
  deleteAppDataOnUninstall: false
